name: spec.prove v4 isolated benchmark
on:
  workflow_dispatch:
    inputs:
      repair_stalled:
        description: Retry and promote the recorded stalled finding
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: benchmark-specprove-v4-baseline
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.event.inputs.repair_stalled != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      score: ${{ steps.score.outputs.value }}
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 2
          persist-credentials: false
      # Yukon enforces editablePaths while constructing the submission commit.
      # Keep this independent check so a malformed submissions/* ref fails
      # before any runtime is downloaded.
      - name: Verify submission surface
        if: startsWith(github.ref, 'refs/heads/submissions/')
        shell: bash
        run: |
          set -euo pipefail
          read -r -a commit_line <<< "$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          if (( ${#commit_line[@]} != 2 )); then
            echo "Submission must be a single-parent commit" >&2
            exit 1
          fi
          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              submission/trace.json) ;;
              *)
                echo "Submission changed a non-editable path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --no-renames --name-only -z "$GITHUB_SHA^" "$GITHUB_SHA")
      - name: Verify submission targets the current baseline
        if: startsWith(github.ref, 'refs/heads/submissions/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin codex/specprove-v4-internal
          if [[ "$(git rev-parse "$GITHUB_SHA^")" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "The baseline advanced after this trace was prepared; sync and resubmit it" >&2
            exit 1
          fi
          python3 -c 'import json,sys; p=json.load(open("experiments/uniswap-v4/specs/progress.json")); sys.exit(0) if p["state"] == "active" else sys.exit("Challenge progress is stalled after a verified finding. Host maintainers must repair and review the baseline, then set specs/progress.json to active before agents submit again.")'
      - name: Setup pinned runtimes and the isolated verifier
        run: bash .yukon/setup.sh
      - name: Benchmark (EVM evidence, independent judgment, proposed repair, replay and Lean)
        env:
          OPENROUTER_API_KEY: ${{ secrets.SPEC_PROVE_OPENROUTER_API_KEY }}
        run: python3 experiments/uniswap-v4/benchmark.py
      - name: Record verified finding and advance checked repair
        if: startsWith(github.ref, 'refs/heads/submissions/')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'printf "{\"status\":\"failed\"}\n" > .yukon/baseline-promotion.json' ERR
          read -r finding_verified report_path < <(python3 -c 'import json; m=json.load(open(".yukon/score.json"))["metrics"]; print(str(m["verified_falsification"] == 1).lower(), m["evidence"] + "/report.json")')
          if [[ "$finding_verified" != true ]]; then
            printf '{"status":"not_applicable"}\n' > .yukon/baseline-promotion.json
            exit 0
          fi
          git fetch --no-tags origin codex/specprove-v4-internal
          base_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$base_sha" != "$(git rev-parse "$GITHUB_SHA^")" ]]; then
            if ! git diff --quiet "$GITHUB_SHA^" "$base_sha" -- \
              experiments/uniswap-v4/baseline.json \
              experiments/uniswap-v4/specs/base.json \
              experiments/uniswap-v4/specs/active/RebateHook.sol \
              experiments/uniswap-v4/specs/active/Rebate.lean \
              experiments/uniswap-v4/intent.json \
              experiments/uniswap-v4/specs/falsification-history.json; then
              echo "Semantic baseline moved during verification; do not apply a stale repair" >&2
              exit 1
            fi
          fi
          next_checkout="$(mktemp -d)"
          git worktree add --detach "$next_checkout" "$base_sha"
          python3 experiments/uniswap-v4/advance_baseline.py --report "$report_path" --base "$next_checkout" --score .yukon/score.json --result .yukon/baseline-promotion.json
          git -C "$next_checkout" add -A -- experiments/uniswap-v4
          if git -C "$next_checkout" diff --cached --quiet; then
            exit 0
          fi
          git -C "$next_checkout" -c user.name='spec.prove host' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Record verified v4 finding and checked baseline"
          gh auth setup-git
          git -C "$next_checkout" push origin HEAD:refs/heads/codex/specprove-v4-internal
      - name: Include baseline progress in agent score
        if: always()
        shell: bash
        run: |
          if [[ -f .yukon/score.json && -f .yukon/baseline-promotion.json ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          score_path = Path('.yukon/score.json')
          score = json.loads(score_path.read_text())
          promotion = json.loads(Path('.yukon/baseline-promotion.json').read_text())
          status = promotion.get('status', 'failed')
          stalled = score['metrics']['verified_falsification'] == 1 and status != 'baseline_updated'
          score['metrics']['baseline_promotion_status'] = status
          score['metrics']['progress_stalled'] = stalled
          score['metrics']['manual_update_required'] = stalled
          if stalled:
              score['metrics']['progress_message'] = (
                  'Finding credited, but the shared baseline did not advance. '
                  'Host maintainers must manually repair and review it before agents submit again.')
          score_path.write_text(json.dumps(score, indent=2) + '\n')
          PY
          fi
      - name: Read score
        id: score
        if: success()
        shell: bash
        run: echo "value=$(python3 -c 'import json; print(json.load(open(".yukon/score.json"))["score"])')" >> "$GITHUB_OUTPUT"
      - name: Upload authoritative score
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: benchmark-score
          path: .yukon/score.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-evidence
          path: |
            runs/reproduced-v4-hosted-*/
            runs/reproduced-proof-reproduced-v4-hosted-*/
            .yukon/baseline-promotion.json
            !runs/reproduced-v4-hosted-*/*.olean
          include-hidden-files: true
          if-no-files-found: ignore

  repair:
    if: github.event.inputs.repair_stalled == 'true' && github.ref == 'refs/heads/codex/specprove-v4-internal'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/specprove-v4-internal
          persist-credentials: false
      - name: Verify recorded stalled finding
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'experiments/uniswap-v4')
          from execution import digest
          import run
          root = Path('experiments/uniswap-v4')
          progress = json.loads((root / 'specs/progress.json').read_text())
          matches = [entry for entry in json.loads((root / 'specs/falsification-history.json').read_text())['traces']
                     if entry['sha256'] == progress.get('finding_sha256')]
          if progress.get('state') != 'stalled' or len(matches) != 1:
              raise SystemExit('No single recorded stalled finding to recover')
          trace = run.read_submission(root / matches[0]['trace'])
          if digest(trace) != progress['finding_sha256']:
              raise SystemExit('Stalled trace digest changed')
          Path('/tmp/specprove-stalled-trace-path').write_text(str(root / matches[0]['trace']))
          PY
      - name: Setup pinned verifier
        run: bash .yukon/setup.sh
      - name: Retry host repair and independent review
        env:
          OPENROUTER_API_KEY: ${{ secrets.SPEC_PROVE_OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          trace_path="$(cat /tmp/specprove-stalled-trace-path)"
          output_path="runs/reproduced-v4-stalled-repair-$(date -u +%Y%m%dT%H%M%SZ)"
          printf '%s' "$output_path" > /tmp/specprove-stalled-output-path
          python3 experiments/uniswap-v4/loop.py --provider openrouter --trace "$trace_path" --rounds 2 --output "$output_path" --repair-deadline-seconds 1800 --repair-attempts 10
      - name: Replay and promote checked baseline
        shell: bash
        run: |
          set -euo pipefail
          output_path="$(cat /tmp/specprove-stalled-output-path)"
          python3 experiments/uniswap-v4/advance_baseline.py --resume-stalled --report "$output_path/report.json" --base . --result "$output_path/promotion.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          output = Path('/tmp/specprove-stalled-output-path').read_text()
          result = json.loads((Path(output) / 'promotion.json').read_text())
          if result['status'] != 'baseline_updated' or result['progress'] != 'active':
              raise SystemExit('Checked baseline was not promoted')
          PY
          git add -- experiments/uniswap-v4
          git -c user.name='spec.prove host' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Repair stalled v4 baseline after full replay'
          gh auth setup-git
          git push origin HEAD:refs/heads/codex/specprove-v4-internal
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stalled-repair-evidence
          path: runs/reproduced-v4-stalled-repair-*/
          if-no-files-found: warn
